name: PnP Core Continuous Integration Tests

on:
  push:
    branches: [dev]

jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Uncomment TestCommon.Instance.Mocking
        run: |
          sed -i 's|//TestCommon.Instance.Mocking = false;|TestCommon.Instance.Mocking = false;|' SharePoint/PermissionRequestsTests.cs
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write environment
        run: echo "loitzl2" > env.txt
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write config
        env:
          SP_USERNAME: ${{ secrets.SP_USERNAME }}
          SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
        run: |
          cat <<EOF > appsettings.loitzl2.json
          {
            "PnPCore": {
              "DisableTelemetry": "true",
              "HttpRequests": {
                "UserAgent": "NONISV|SharePointPnP|PnPCoreSDK",
                "SharePointRest": {
                  "UseRetryAfterHeader": "false",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                },
                "MicrosoftGraph": {
                  "UseRetryAfterHeader": "true",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                }
              },
              "PnPContext": {
                "GraphFirst": "true",
                "GraphCanUseBeta": "true",
                "GraphAlwaysUseBeta": "false"
              },
              "Credentials": {
                "DefaultConfiguration": "MySetup",
                "Configurations": {
                  "MySetup": {
                    "ClientId": "321ca64c-21e3-43d6-b39c-81a225ef148f",
                    "TenantId": "60df2466-a102-404a-8d9d-95c950626730",
                    "UsernamePassword": {
                      "Username": "$SP_USERNAME",
                      "Password": "$SP_PASSWORD"
                    }
                  },
                  "x509Certificate": {
                    "ClientId": "321ca64c-21e3-43d6-b39c-81a225ef148f",
                    "TenantId": "60df2466-a102-404a-8d9d-95c950626730",
                    "X509Certificate": {
                      "StoreName": "My",
                      "StoreLocation": "CurrentUser",
                      "ThumbPrint": "84E57F114E06A67DAA369F6DEC637CBA12ACABCC"
                    }
                  }
                }
              },
              "Sites": {
                "TestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "TestSubSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup/subsite",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "NoGroupTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktest",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "ClassicSTS0TestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/sts0",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "TenantAdminCenterSite": {
                  "SiteUrl": "https://loitzl2-admin.sharepoint.com",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "VivaTopicCenterTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/TopicCenter",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "HomeTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com",
                  "AuthenticationProviderName": "x509Certificate"
                }
              }
            },
            "Logging": {
              "LogLevel": {
                "Default": "Debug"
              }
            }
          }
          EOF
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Test Integration
        run: dotnet test ./PnP.Core.Admin.Test.csproj --filter "PermissionRequestsTests"
        working-directory: src/sdk/PnP.Core.Admin.Test
      - uses: actions/upload-artifact@v4
        with:
          name: testresults
          path: |
            **/TestResults/
        
