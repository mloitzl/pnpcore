name: PnP Core Continuous Integration Tests

on:
  push:
    branches: [dev]

jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - name: Check User
        run: whoami
      - name: Print Environment Variables
        run: env
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'
          include-prerelease: false
      - name: Check .NET SDK Version
        run: dotnet --info
      - name: Install dotnet-certificate-tool (Global)
        run: dotnet tool install -g dotnet-certificate-tool
      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Run certificate-tool
        env:
          BASE64_CERTIFICATE: ${{ secrets.BASE64_CERTIFICATE }}
        run: |
          certificate-tool add -b $BASE64_CERTIFICATE
          certificate-tool list
        
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Check Directory Permissions
        run: ls -l PnP.Core.Admin.Test
        working-directory: src/sdk
        
      - name: Uncomment TestCommon.Instance.Mocking
        run: |
          sed -i 's|//TestCommon.Instance.Mocking = false;|TestCommon.Instance.Mocking = false;|' SharePoint/PermissionRequestsTests.cs
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write environment
        run: echo "loitzl2" > env.txt
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write config
        env:
          SP_USERNAME: ${{ secrets.SP_USERNAME }}
          SP_PASSWORD: ${{ secrets.SP_PASSWORD }}
        run: |
          cat <<EOF > appsettings.loitzl2.json
          {
            "PnPCore": {
              "DisableTelemetry": "true",
              "HttpRequests": {
                "UserAgent": "NONISV|SharePointPnP|PnPCoreSDK",
                "SharePointRest": {
                  "UseRetryAfterHeader": "false",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                },
                "MicrosoftGraph": {
                  "UseRetryAfterHeader": "true",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                }
              },
              "PnPContext": {
                "GraphFirst": "true",
                "GraphCanUseBeta": "true",
                "GraphAlwaysUseBeta": "false"
              },
              "Credentials": {
                "DefaultConfiguration": "MySetup"               
                },
              "Sites": {
                "TestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup",
                  "AuthenticationProviderName": "MySetup"
                },
                "TestSubSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup/subsite",
                  "AuthenticationProviderName": "MySetup"
                },
                "NoGroupTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktest",
                  "AuthenticationProviderName": "MySetup"
                },
                "ClassicSTS0TestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/sts0",
                  "AuthenticationProviderName": "MySetup"
                },
                "TenantAdminCenterSite": {
                  "SiteUrl": "https://loitzl2-admin.sharepoint.com",
                  "AuthenticationProviderName": "MySetup"
                },
                "VivaTopicCenterTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com/sites/TopicCenter",
                  "AuthenticationProviderName": "MySetup"
                },
                "HomeTestSite": {
                  "SiteUrl": "https://loitzl2.sharepoint.com",
                  "AuthenticationProviderName": "MySetup"
                }
              }
            },
            "Logging": {
              "LogLevel": {
                "Default": "Trace"
              }
            }
          }
          EOF
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Certs
        run: |
          dotnet run
        working-directory: src/sdk/certs

      - name: Test Integration
        run: |
          certificate-tool list
          dotnet test ./PnP.Core.Admin.Test.csproj --filter "PermissionRequestsTests"
        working-directory: src/sdk/PnP.Core.Admin.Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults
          path: |
            **/TestResults/**/*        
