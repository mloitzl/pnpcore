name: PnP Core Continuous Integration Tests

on:
  push:
    branches: [dev]

jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'
          include-prerelease: false
      - name: Check .NET SDK Version
        run: dotnet --info

      - name: Checkout code
        uses: actions/checkout@v3
      - name: Uncomment TestCommon.Instance.Mocking
        run: |
          sed -i 's|//TestCommon.Instance.Mocking = false;|TestCommon.Instance.Mocking = false;|' SharePoint/PermissionRequestsTests.cs
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write config
        env:
          CERTIFICATE_THUMBPRINT: ${{ secrets.CERTIFICATE_THUMBPRINT }}
          TENANT_NAME: ${{ secrets.TENANT_NAME }}
        run: |
          cat <<EOF > appsettings.ci.json
          {
            "PnPCore": {
              "DisableTelemetry": "true",
              "HttpRequests": {
                "UserAgent": "NONISV|SharePointPnP|PnPCoreSDK",
                "SharePointRest": {
                  "UseRetryAfterHeader": "false",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                },
                "MicrosoftGraph": {
                  "UseRetryAfterHeader": "true",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                }
              },
              "PnPContext": {
                "GraphFirst": "true",
                "GraphCanUseBeta": "true",
                "GraphAlwaysUseBeta": "false"
              },
              "Credentials": {
                "DefaultConfiguration": "x509Certificate",
                "Configurations": {
                  "x509Certificate": {
                    "ClientId": "321ca64c-21e3-43d6-b39c-81a225ef148f",
                    "TenantId": "60df2466-a102-404a-8d9d-95c950626730",
                    "X509Certificate": {
                      "StoreName": "My",
                      "StoreLocation": "CurrentUser",
                      "ThumbPrint": "$CERTIFICATE_THUMBPRINT",
                    }
                  }
                }
              },
              "Sites": {
                "TestSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com/sites/pnpcoresdktestgroup",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "TestSubSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com/sites/pnpcoresdktestgroup/subsite",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "NoGroupTestSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com/sites/pnpcoresdktest",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "ClassicSTS0TestSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com/sites/sts0",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "TenantAdminCenterSite": {
                  "SiteUrl": "https://$TENANT_NAME-admin.sharepoint.com",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "VivaTopicCenterTestSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com/sites/TopicCenter",
                  "AuthenticationProviderName": "x509Certificate"
                },
                "HomeTestSite": {
                  "SiteUrl": "https://$TENANT_NAME.sharepoint.com",
                  "AuthenticationProviderName": "x509Certificate"
                }
              }
            },
            "Logging": {
              "LogLevel": {
                "Default": "Trace"
              }
            }
          }
          EOF
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Test Integration
        run: |
          dotnet test ./PnP.Core.Admin.Test.csproj --filter "PermissionRequestsTests" --logger trx --results-directory ./TestResults
        working-directory: src/sdk/PnP.Core.Admin.Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults
          path: |
            **/TestResults/**/*

