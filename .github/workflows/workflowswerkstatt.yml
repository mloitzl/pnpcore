name: PnP Core Continuous Integration Tests

on:
  push:
    branches: [dev]

jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Uncomment TestCommon.Instance.Mocking
        run: |
          sed -i 's|//TestCommon.Instance.Mocking = false;|TestCommon.Instance.Mocking = false;|' SharePoint/PermissionRequestsTests.cs
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write environment
        run: echo "loitzl2" > env.txt
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Write config
        run: |
          cat <<EOF > appsettings.loitzl2.json
          {
            "PnPCore": {
              "DisableTelemetry": "true",
              "HttpRequests": {
                "UserAgent": "NONISV|SharePointPnP|PnPCoreSDK",
                "SharePointRest": {
                  "UseRetryAfterHeader": "false",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                },
                "MicrosoftGraph": {
                  "UseRetryAfterHeader": "true",
                  "MaxRetries": "10",
                  "DelayInSeconds": "3",
                  "UseIncrementalDelay": "true"
                }
              },
              "PnPContext": {
                "GraphFirst": "true",
                "GraphCanUseBeta": "true",
                "GraphAlwaysUseBeta": "false"
              },
              "Credentials": {
                "DefaultConfiguration": "MySetup",
                "Configurations": {
                  "MySetup": {
                    "ClientId": "321ca64c-21e3-43d6-b39c-81a225ef148f",
                    "TenantId": "60df2466-a102-404a-8d9d-95c950626730",
                    "X509Certificate": {
                      "StoreName": "My",
                      "StoreLocation": "CurrentUser",
                      "ThumbPrint": "84E57F114E06A67DAA369F6DEC637CBA12ACABCC"
                    }
                  }
                },
                "Sites": {
                    "TestSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "TestSubSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktestgroup/subsite",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "NoGroupTestSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com/sites/pnpcoresdktest",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "ClassicSTS0TestSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com/sites/sts0",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "TenantAdminCenterSite": {
                        "SiteUrl": "https://loitzl2-admin.sharepoint.com",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "VivaTopicCenterTestSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com/sites/TopicCenter",
                        "AuthenticationProviderName": "x509Certificate"
                    },
                    "HomeTestSite": {
                        "SiteUrl": "https://loitzl2.sharepoint.com",
                        "AuthenticationProviderName": "x509Certificate"
                    }
                }
              },
              "Logging": {
                "LogLevel": {
                  "Default": "Debug"
                }
              }
            }
          }
          EOF
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Install dependencies
        run: dotnet restore
        working-directory: src/sdk
      - name: Build ⚙
        run:  dotnet build --configuration debug --no-restore --verbosity normal 
        working-directory: src/sdk
      - name: Test Integration
        run: dotnet test --filter "PermissionRequestsTests" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
        working-directory: src/sdk/PnP.Core.Admin.Test
      - name: Upload Test Results as Artifact
        uses: actions/upload-artifact@v3
        working-directory: src/sdk/PnP.Core.Admin.Test
        with:
          name: dotnet-test-results
          path: TestResults

      - name: Install ReportGenerator (for HTML conversion)
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Generate HTML Report
        run: reportgenerator "-reports:TestResults/*.trx" "-targetdir:TestResults/Report" "-reporttypes:HtmlInline_AzurePipelines"
        working-directory: src/sdk/PnP.Core.Admin.Test

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-test-report
          path: TestResults/Report
      - name: Publish Test Summary
        uses: test-summary/action@v2
        with:
          paths: TestResults/test-results.trx
    
        
